<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iTero · Photo Collection Assistant</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2530;--mut:#6b7785;--line:#d5dce3;--acc:#1f8fd6;--ok:#2a9d5c;--warn:#d98a1c;--tile:#eef1f4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1d232a;--ink:#e8edf2;--mut:#93a0ae;--line:#33404d;--tile:#252d36}}
:root[data-theme="dark"]{--bg:#14181d;--card:#1d232a;--ink:#e8edf2;--mut:#93a0ae;--line:#33404d;--tile:#252d36}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{font-size:18px;margin:0 auto 0 0;align-self:center}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:4px}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:210px}
select:focus,input:focus{outline:2px solid var(--acc);outline-offset:0}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1100px;margin:0 auto;padding:18px 20px 40px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar .st{margin-left:auto;color:var(--mut)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--mut);margin-bottom:16px;background:var(--card)}
.drop.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.grid .tile{flex:0 0 calc((100% - 36px)/4)}
@media (max-width:900px){.grid .tile{flex-basis:calc((100% - 24px)/3)}}
@media (max-width:560px){.grid .tile{flex-basis:calc((100% - 12px)/2)}}
.tile{position:relative;background:var(--tile);border:2px solid transparent;border-radius:12px;aspect-ratio:4/3;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tile.over{border-color:var(--acc)}
.tile.full{border-color:var(--ok)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .ph{text-align:center;color:var(--mut);padding:10px 10px 38px}
.tile .plus{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;font-size:24px;line-height:32px;margin:0 auto 8px}
.n{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--bg);border-radius:6px;font-size:12px;font-weight:700;padding:1px 7px;z-index:2}
.cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.66);color:#fff;font-size:12.5px;padding:6px 9px;z-index:2;line-height:1.25}
.x{position:absolute;top:6px;right:6px;z-index:3;width:26px;height:26px;border-radius:50%;padding:0;background:rgba(0,0,0,.65);color:#fff;border:0;font-size:16px;line-height:1}
.fn{font-size:11px;opacity:.8;display:block;word-break:break-all}
.ref{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1);opacity:.4}
.tile .ph{position:relative;z-index:1;text-shadow:0 0 8px var(--tile),0 0 8px var(--tile)}
.adm{position:absolute;top:6px;right:6px;z-index:3;width:26px;height:26px;padding:0;border-radius:50%;font-size:13px;line-height:1}
#adminbar{display:none;gap:8px;align-items:center;padding:6px 10px;border:1px dashed var(--warn);border-radius:8px;color:var(--mut);font-size:13px}
#msg{margin-top:14px;color:var(--mut);min-height:20px}
@media (max-width:560px){select,input[type=text]{min-width:0;width:100%}header label{flex:1 1 100%}}
</style>
</head>
<body>
<header>
  <h1>iTero · Photo Collection Assistant</h1>
  <label>Scanner Model
    <select id="model"></select>
  </label>
  <label>Scanner Serial Number
    <input type="text" id="sn" placeholder="Ej. BLX2022W12A123" autocomplete="off">
  </label>
  <button class="pri" id="dir" disabled>Save in Folder</button>
  <button id="exp" disabled>Export ZIP</button>
</header>
<main>
  <div class="drop" id="drop">Drag a photo into each slot, or drop <b>all photos at once</b> here (they will be assigned alphabetically to the empty slots).</div>
  <div class="bar">
    <button id="clear">Clean photos</button>
    <span id="adminbar">🛠 Admin Mode · <span id="pcount"></span> <button id="pexp">Export placeholders</button></span>
    <span class="st" id="st"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div id="msg"></div>
</main>
<input type="file" id="fs" accept="image/*" hidden>
<input type="file" id="fa" accept="image/*" hidden>

// =========================
let admTarget=null;
const $=id=>document.getElementById(id);
let model=Object.keys(MODELS)[0], files=[], urls=[], target=null;
const sel=$('model');
Object.keys(MODELS).forEach(k=>sel.add(new Option(k,k)));
const names=()=>MODELS[model];
const isImg=f=>f&&(f.type.startsWith('image/')||/\.(jpe?g|png|webp|heic|heif|bmp|gif)$/i.test(f.name));
const cleanSN=()=>$('sn').value.trim().replace(/[\\/:*?"<>|]+/g,'-');
const ext=f=>{const m=/\.([a-z0-9]+)$/i.exec(f.name);return m?m[1].toLowerCase():'jpg'};
function setFile(i,f){if(urls[i])URL.revokeObjectURL(urls[i]);files[i]=f;urls[i]=f?URL.createObjectURL(f):null}
function reset(){urls.forEach(u=>u&&URL.revokeObjectURL(u));files=names().map(()=>null);urls=names().map(()=>null)}
function render(){
  const g=$('grid');g.innerHTML='';
  names().forEach((n,i)=>{
    const t=document.createElement('div');t.className='tile'+(files[i]?' full':'');
    const b=document.createElement('span');b.className='n';b.textContent=i+1;t.append(b);
    if(files[i]){
      const im=document.createElement('img');im.src=urls[i];im.alt=n;t.append(im);
      const x=document.createElement('button');x.className='x';x.title='Quitar';x.textContent='×';
      if(ADMIN_MODE)x.style.right='38px';
      x.onclick=e=>{e.stopPropagation();setFile(i,null);render()};t.append(x);
    }else{
      if(PLACEHOLDERS[n]){const rf=document.createElement('img');rf.className='ref';rf.src=PLACEHOLDERS[n];rf.alt='';t.append(rf)}
      const p=document.createElement('div');p.className='ph';p.innerHTML='<div class="plus">+</div>Arrastra o haz clic';t.append(p);
    }
    const c=document.createElement('div');c.className='cap';c.textContent=n;
    if(files[i]){const s=document.createElement('span');s.className='fn';s.textContent=(cleanSN()||'SERIE')+'_'+n+'.'+ext(files[i]);c.append(s)}
    t.append(c);
    if(ADMIN_MODE){const a=document.createElement('button');a.className='adm';a.textContent='📌';a.title='Cargar placeholder para esta posición';a.onclick=e=>{e.stopPropagation();admTarget=n;$('fa').value='';$('fa').click()};t.append(a)}
    t.onclick=()=>{target=i;$('fs').value='';$('fs').click()};
    t.ondragover=e=>{e.preventDefault();e.stopPropagation();t.classList.add('over')};
    t.ondragleave=()=>t.classList.remove('over');
    t.ondrop=e=>{e.preventDefault();e.stopPropagation();t.classList.remove('over');
      const fl=[...e.dataTransfer.files].filter(isImg);
      if(fl.length===1){setFile(i,fl[0]);render()}else if(fl.length>1)fillMany(fl)};
    g.append(t);
  });
  $('adminbar').style.display=ADMIN_MODE?'flex':'none';
  $('pcount').textContent=Object.keys(PLACEHOLDERS).length+' placeholders cargados';
  const n=files.filter(Boolean).length;
  $('st').textContent=n+' de '+names().length+' fotos';
  $('exp').disabled=$('dir').disabled=!(n>0&&cleanSN());
}
function fillMany(fl){
  fl=fl.filter(isImg).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  let k=0;
  for(let i=0;i<files.length&&k<fl.length;i++)if(!files[i])setFile(i,fl[k++]);
  $('msg').textContent=k<fl.length?(fl.length-k)+' Changing the model will remove all uploaded photos. Do you want to continue?.':'';
  render();
}
sel.onchange=()=>{
  if(files.some(Boolean)&&!confirm('Changing the model will remove all uploaded photos. Do you want to continue?')){sel.value=model;return}
  model=sel.value;reset();$('msg').textContent='';render();
};
$('sn').oninput=render;
$('clear').onclick=()=>{reset();$('msg').textContent='';render()};
$('fs').onchange=e=>{const f=e.target.files[0];if(f&&isImg(f)&&target!=null){setFile(target,f);render()}};
const d=$('drop');
d.ondragover=e=>{e.preventDefault();d.classList.add('over')};
d.ondragleave=()=>d.classList.remove('over');
d.ondrop=e=>{e.preventDefault();d.classList.remove('over');fillMany([...e.dataTransfer.files])};
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>e.preventDefault());

const confirmMissing=()=>{
  const missing=names().filter((_,i)=>!files[i]);
  return !missing.length||confirm('Missing '+missing.length+' photo(s):\n\n• '+missing.join('\n• ')+'\n\n¿Export anyway ?');
};
if(!window.showDirectoryPicker)$('dir').style.display='none';
$('dir').onclick=async()=>{
  const sn=cleanSN();if(!sn||!confirmMissing())return;
  try{
    const root=await window.showDirectoryPicker({mode:'readwrite'});
    const fo=await root.getDirectoryHandle(sn,{create:true});
    let c=0;
    for(let i=0;i<files.length;i++){
      if(!files[i])continue;
      const fh=await fo.getFileHandle(sn+'_'+names()[i]+'.'+ext(files[i]),{create:true});
      const w=await fh.createWritable();await w.write(files[i]);await w.close();c++;
    }
    $('msg').textContent='Completed: '+c+' photos were saved in folder "'+sn+'".';
  }catch(err){
    if(err&&err.name==='AbortError')$('msg').textContent='Cancelled.';
    else $('msg').textContent='Cannot save in folder ('+(err.message||err)+'). Use "Export zip" instead.';
  }
};
$('exp').onclick=async()=>{
  const sn=cleanSN();if(!sn||!confirmMissing())return;
  $('msg').textContent='Generating ZIP…';
  try{
    const z=new JSZip(),fo=z.folder(sn);
    names().forEach((n,i)=>{if(files[i])fo.file(sn+'_'+n+'.'+ext(files[i]),files[i])});
    const blob=await z.generateAsync({type:'blob',compression:'STORE'});
    const fname=sn+'.zip';
    let dl=null;try{dl=await claude.use('downloads')}catch(e){}
    if(dl){await dl.save({filename:fname,data:blob})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.append(a);a.click();a.remove()}
    $('msg').textContent='Completed: '+fname+' ('+files.filter(Boolean).length+' photos were renamed).';
  }catch(err){
    $('msg').textContent=err&&err.code==='declined'?'Download cancelled.':'Failed to export: '+(err.message||err);
  }
};
$('fa').onchange=async e=>{
  const f=e.target.files[0];if(!f||!admTarget)return;
  try{
    const bm=await createImageBitmap(f),k=Math.min(1,480/Math.max(bm.width,bm.height));
    const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    PLACEHOLDERS[admTarget]=c.toDataURL('image/jpeg',.72);render();
  }catch(err){$('msg').textContent='Could not read image: '+(err.message||err)}
};
$('pexp').onclick=async()=>{
  if(!Object.keys(PLACEHOLDERS).length){$('msg').textContent='Aún no hay placeholders cargados.';return}
  const txt='const PLACEHOLDERS = '+JSON.stringify(PLACEHOLDERS)+';';
  try{
    let dl=null;try{dl=await claude.use('downloads')}catch(e){}
    if(dl)await dl.save({filename:'placeholders.txt',data:txt});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='placeholders.txt';document.body.append(a);a.click();a.remove()}
    $('msg').textContent='Exportado. Reemplaza la línea "const PLACEHOLDERS = {};" del código con el contenido de placeholders.txt.';
  }catch(err){$('msg').textContent=err&&err.code==='declined'?'Descarga cancelada.':'Error: '+(err.message||err)}
};
reset();render();
</script>
